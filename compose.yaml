name: maple-portfolio-dev
services:
  mcp:
    build:
      context: .
      dockerfile: infra/node.Dockerfile
      target: mcp
    ports:
      - "127.0.0.1:3000:3000"
    init: true
  dashboard:
    build:
      context: .
      dockerfile: infra/node.Dockerfile
      target: dashboard
    ports:
      - "127.0.0.1:5173:5173"
    init: true
  analytics:
    build:
      context: .
      dockerfile: infra/analytics.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    init: true
