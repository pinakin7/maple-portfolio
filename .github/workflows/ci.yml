name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.23
          python-version: 3.12.14
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy analytics tests
      - run: uv run --locked pytest
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: |
          docker compose up -d
          curl --retry 20 --retry-delay 1 --retry-all-errors --fail http://127.0.0.1:3000/healthz
          curl --retry 20 --retry-delay 1 --retry-all-errors --fail http://127.0.0.1:8000/healthz
          curl --retry 20 --retry-delay 1 --retry-all-errors --fail http://127.0.0.1:5173/
      - if: always()
        run: docker compose down
